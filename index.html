<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adrian Cuadrado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    header {
      text-align: center;
      padding: 60px 20px 20px;
    }
    header h1 {
      font-size: 3rem;
      margin: 0;
    }
    header p {
      font-size: 1.2rem;
      color: #8b949e;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .section {
      margin-bottom: 40px;
    }
    .section h2 {
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #8b949e;
      border-top: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hello, I'm Adrián Cuadrado 👋</h1>
    <p>Web Developer</p>
  </header>
  <div class="container">
    <div class="section">
      <h2>Contact</h2>
      <p>
        You can reach me on 
        <a href="https://www.linkedin.com/in/adrian-cuadrado-chavarria/" target="_blank">LinkedIn</a> or
        <a href="https://www.reddit.com/user/AdrianCuad/" target="_blank">Reddit</a>.
      </p>
    </div>
  </div>
  <footer>
    © 2025 Adrian Cuadrado — Built with ChatGPT (I wanted to have a personal website but didn't want to spend too much time on it for now).
  </footer>
</body>
</html>
